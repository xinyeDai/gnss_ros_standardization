observation_topic: /gnss/observation
ephemeris_topic: /gnss/ephemeris
solution_topic: /gnss/solution

elevation_mask_deg: 15.0

frequencies:
  l1: true
  l2: true
  l5: true

# true: first successful SPP solution becomes ENU origin.
# false: use the fixed WGS84 ellipsoidal BLH below.
auto_origin: true
origin_latitude: 0.0
origin_longitude: 0.0
origin_altitude: 0.0
